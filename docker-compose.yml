services:
  backend:
    build: ./backend
    image: surajbelwal/skillbridge-backend:latest
    container_name: backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: surajbelwal/skillbridge-frontend:latest
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  sql_data: